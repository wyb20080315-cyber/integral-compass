name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10', sympy: '1.13.3'}
          - {os: ubuntu-latest, python: '3.11', sympy: '1.14.0'}
          - {os: ubuntu-latest, python: '3.12', sympy: '1.14.0'}
          - {os: ubuntu-latest, python: '3.13', sympy: '1.14.0'}
          - {os: windows-latest, python: '3.12', sympy: '1.14.0'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]' 'sympy==${{ matrix.sympy }}'
      - run: ruff check .
      - run: python -m pytest -q
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel outside source tree
        run: |
          python -m venv /tmp/compass-smoke
          /tmp/compass-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/compass-smoke/bin/integral-compass 'x**2*exp(x)' --json
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
