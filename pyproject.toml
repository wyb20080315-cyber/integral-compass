[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "integral-compass"
version = "0.1.0"
description = "Explainable classroom integration with DI tables, partial fractions, and honest elementary-integrability outcomes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Integral Compass contributors"}]
keywords = ["integration", "calculus", "education", "sympy", "partial-fractions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["sympy>=1.13,<1.15"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2", "twine>=6", "ruff>=0.9"]

[project.urls]
Homepage = "https://github.com/wyb20080315-cyber/integral-compass"
Repository = "https://github.com/wyb20080315-cyber/integral-compass"
Documentation = "https://github.com/wyb20080315-cyber/integral-compass/blob/main/docs/guide.zh-CN.md"
Issues = "https://github.com/wyb20080315-cyber/integral-compass/issues"

[project.scripts]
integral-compass = "integral_compass.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.hatch.build.targets.wheel]
packages = ["src/integral_compass"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/examples", "/README.md", "/LICENSE", "/CONTRIBUTING.md", "/CHANGELOG.md"]
